name: RepFlow APK Build

on:
  push:
    branches:
      - repflow-capacitor-apk-build-290820262129
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-repflow-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Rehydrate verified RepFlow Capacitor source
        shell: bash
        run: |
          set -euxo pipefail
          exec > >(tee -a /tmp/rehydrate-diagnostics.txt) 2>&1
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path

          missing = (
              'YT3oraAEOoExmrCvbriZLGtNW1R8oLm4te0OyJWTm/ny2J2uMalJxildbcSEH3f0'
              'cgMnAt4K2c+fmL/qCchThhXseHwq9muNVKOgwGCDAMd3nY3iQ+aqmKKd6tyZqtv0fDSRmB7Z'
          )
          marker = '[... ELLIPSIZATION ...]'
          expected_p6 = '85adf70a0f854be654b70a82ba6947dc7d3496ff7ee23c4ba2e6a42823159a23'
          expected_zip = '5371b4804e07834689a3ef9aaff6abb412abc068a0ef3dd2388878018f26d255'

          prefix = Path('repflow-ci/payload.part00').read_text() + Path('repflow-ci/payload.part01').read_text()
          prefix = ''.join(prefix.split())
          if len(prefix) != 40000:
              raise SystemExit(f'unexpected clean prefix length: {len(prefix)}')

          p6 = Path('repflow-ci/bundle.part06').read_text()
          if p6.count(marker) != 1:
              raise SystemExit(f'expected exactly one ellipsization marker in bundle.part06, found {p6.count(marker)}')
          p6 = ''.join(p6.replace(marker, missing).split())
          print(f'part06_after_marker_repair_len={len(p6)} sha256={hashlib.sha256(p6.encode()).hexdigest()}')

          if hashlib.sha256(p6.encode()).hexdigest() != expected_p6:
              if len(p6) != 20004:
                  raise SystemExit(f'unexpected repaired part06 length: {len(p6)}')
              recovered = None
              for i in range(0, len(p6) - 3):
                  candidate = p6[:i] + p6[i+4:]
                  if hashlib.sha256(candidate.encode()).hexdigest() == expected_p6:
                      recovered = candidate
                      print(f'part06_recovered_by_deleting_position={i} chars={p6[i:i+4]!r}')
                      break
              if recovered is None:
                  raise SystemExit('could not recover exact part06 via four-character deletion')
              p6 = recovered

          if len(p6) != 20000 or hashlib.sha256(p6.encode()).hexdigest() != expected_p6:
              raise SystemExit('part06 clean hash/length gate failed')
          print('part06_exact_hash_gate=PASS')

          pieces = [
              prefix,
              ''.join(Path('repflow-ci/bundle.part03').read_text().split()),
              ''.join(Path('repflow-ci/bundle.part04').read_text().split()),
              ''.join(Path('repflow-ci/bundle.part05').read_text().split()),
              p6,
              ''.join(Path('repflow-ci/bundle.part07').read_text().split()),
              ''.join(Path('repflow-ci/bundle.part08').read_text().split()),
          ]
          clean = ''.join(pieces)
          print(f'reconstructed_base64_bytes={len(clean)} mod4={len(clean)%4}')
          if len(clean) != 140412 or len(clean) % 4:
              raise SystemExit('reconstructed Base64 length mismatch')

          data = base64.b64decode(clean, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          print(f'reconstructed_zip_bytes={len(data)} sha256={digest} magic={data[:4]!r}')
          if digest != expected_zip:
              raise SystemExit(f'source ZIP SHA-256 mismatch: {digest} != {expected_zip}')
          if not data.startswith(b'PK'):
              raise SystemExit('decoded payload is not a ZIP')
          Path('/tmp/repflow_android_slim.zip').write_bytes(data)
          PY
          unzip -t /tmp/repflow_android_slim.zip
          mkdir -p repflow
          unzip -q /tmp/repflow_android_slim.zip -d repflow
          sha256sum /tmp/repflow_android_slim.zip | tee /tmp/source-sha256.txt
          test -f repflow/package.json
          test -f repflow/capacitor.config.json
          test -f repflow/scripts/bootstrap-capacitor.sh
          test -f repflow/scripts/patch-android.py
          test -f repflow/web/index.html
          test -f repflow/web/icon-512.png
          test -f repflow/web/icon-maskable-512.png

      - name: Upload rehydrate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repflow-rehydrate-diagnostics
          path: /tmp/rehydrate-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact Capacitor dependencies
        working-directory: repflow
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund

      - name: Verify exact Capacitor versions
        working-directory: repflow
        shell: bash
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const deps=['@capacitor/core','@capacitor/android','@capacitor/cli'];
          for (const d of deps) {
            const v=require(`./node_modules/${d}/package.json`).version;
            console.log(`${d}=${v}`);
            if (v !== '8.5.0') process.exit(1);
          }
          NODE

      - name: Generate and configure native Android project
        working-directory: repflow
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/bootstrap-capacitor.sh
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('android/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text()

          # Configure only normal, least-privilege permissions actually used by RepFlow.
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK',
          ]
          missing = [p for p in permissions if f'android:name="{p}"' not in text]
          if missing:
              tags = ''.join(f'    <uses-permission android:name="{p}" />\n' for p in missing)
              text, count = re.subn(r'(<application\b)', tags + r'\1', text, count=1)
              if count != 1:
                  raise SystemExit('could not insert Android permissions')

          # Lock native app identity/security metadata.
          app_match = re.search(r'<application\b[^>]*>', text, re.S)
          if not app_match:
              raise SystemExit('could not locate <application> in AndroidManifest.xml')
          app = app_match.group(0)
          attrs = {
              'networkSecurityConfig': '@xml/network_security_config',
              'label': '@string/app_name',
              'icon': '@mipmap/ic_launcher',
              'roundIcon': '@mipmap/ic_launcher_round',
              'allowBackup': 'false',
              'fullBackupContent': 'false',
              'supportsRtl': 'true',
          }
          for key, value in attrs.items():
              pattern = rf'android:{re.escape(key)}="[^"]*"'
              replacement = f'android:{key}="{value}"'
              if re.search(pattern, app):
                  app = re.sub(pattern, replacement, app, count=1)
              else:
                  app = app[:-1] + ' ' + replacement + '>'
          text = text[:app_match.start()] + app + text[app_match.end():]
          manifest.write_text(text)

          # Lock app name in Android resources.
          strings = root / 'res/values/strings.xml'
          st = strings.read_text()
          for key in ('app_name', 'title_activity_main'):
              pat = rf'(<string\s+name="{key}">).*?(</string>)'
              if re.search(pat, st, re.S):
                  st = re.sub(pat, rf'\1RepFlow\2', st, count=1, flags=re.S)
          strings.write_text(st)

          res = root / 'res'
          drawable = res / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)

          # Native vector foreground reproduces the RepFlow neon waveform and cyan ring.
          foreground = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:pathData="M58,276 L141,276 L166,211 L208,366 L255,131 L296,292 L325,212 L350,276 L454,276"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#CAFF00" android:strokeWidth="17"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
              <path android:pathData="M256,216 A40,40 0,1 0,256,296 A40,40 0,1 0,256,216"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#05C7F2" android:strokeWidth="12"
                  android:strokeLineCap="round"/>
          </vector>
          '''
          (drawable / 'ic_launcher_foreground.xml').write_text(foreground)

          monochrome = foreground.replace('#CAFF00', '#FFFFFFFF').replace('#05C7F2', '#FFFFFFFF')
          (drawable / 'ic_launcher_monochrome.xml').write_text(monochrome)

          legacy = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:pathData="M0,0 L512,0 L512,512 L0,512 Z" android:fillColor="#030914"/>
              <path android:pathData="M58,276 L141,276 L166,211 L208,366 L255,131 L296,292 L325,212 L350,276 L454,276"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#CAFF00" android:strokeWidth="17"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
              <path android:pathData="M256,216 A40,40 0,1 0,256,296 A40,40 0,1 0,256,216"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#05C7F2" android:strokeWidth="12"
                  android:strokeLineCap="round"/>
          </vector>
          '''

          # Remove Capacitor's stock launcher art so no default icon can win resource selection.
          for path in res.rglob('ic_launcher*'):
              if path.is_file() and path.parent != drawable:
                  path.unlink()

          base = res / 'mipmap-anydpi'
          base.mkdir(parents=True, exist_ok=True)
          (base / 'ic_launcher.xml').write_text(legacy)
          (base / 'ic_launcher_round.xml').write_text(legacy)

          bg = res / 'values/ic_launcher_background.xml'
          bg.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#030914</color></resources>\n')

          adaptive26 = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          adaptive33 = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          '''
          for qualifier, xml in (('mipmap-anydpi-v26', adaptive26), ('mipmap-anydpi-v33', adaptive33)):
              d = res / qualifier
              d.mkdir(parents=True, exist_ok=True)
              (d / 'ic_launcher.xml').write_text(xml)
              (d / 'ic_launcher_round.xml').write_text(xml)

          print('configured RepFlow Android identity, launcher icons and least-privilege permissions')
          PY

          test -x android/gradlew
          grep -q 'net.nexarenew.repflow' capacitor.config.json
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WAKE_LOCK' android/app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          grep -q '>127.0.0.1<' android/app/src/main/res/xml/network_security_config.xml
          grep -q '>localhost<' android/app/src/main/res/xml/network_security_config.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -q '<monochrome ' android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml

      - name: Build debug APK
        working-directory: repflow/android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK identity, permissions, icon, integrity and signature
        shell: bash
        run: |
          set -euxo pipefail
          APK="repflow/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p repflow-release
          cp "$APK" repflow-release/RepFlow-debug.apk
          sha256sum "$APK" | tee repflow-release/SHA256SUMS.txt
          cp /tmp/source-sha256.txt repflow-release/SOURCE_SHA256.txt

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee repflow-release/aapt-badging.txt
          "$AAPT" dump permissions "$APK" | tee repflow-release/aapt-permissions.txt
          grep -q "package: name='net.nexarenew.repflow'" repflow-release/aapt-badging.txt
          grep -q "application-label:'RepFlow'" repflow-release/aapt-badging.txt
          grep -q "application-icon-.*:'res/.*ic_launcher" repflow-release/aapt-badging.txt
          grep -q 'android.permission.INTERNET' repflow-release/aapt-permissions.txt
          grep -q 'android.permission.ACCESS_NETWORK_STATE' repflow-release/aapt-permissions.txt
          grep -q 'android.permission.VIBRATE' repflow-release/aapt-permissions.txt
          grep -q 'android.permission.WAKE_LOCK' repflow-release/aapt-permissions.txt
          if grep -Eq 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' repflow-release/aapt-permissions.txt; then
            echo 'Unexpected dangerous/unneeded permission found' >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee repflow-release/apksigner-verification.txt
          unzip -t "$APK" | tee repflow-release/apk-zip-test.txt

          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            java -version 2>&1
            echo
            echo "Capacitor package manifest:"
            cat repflow/package.json
            echo
            echo "Gradle wrapper:"
            cat repflow/android/gradle/wrapper/gradle-wrapper.properties
          } > repflow-release/toolchain.txt

          cp repflow/android/app/build/outputs/apk/debug/output-metadata.json repflow-release/output-metadata.json
          cp repflow/android/app/src/main/AndroidManifest.xml repflow-release/AndroidManifest.xml
          cp repflow/android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml repflow-release/ic_launcher_v33.xml

      - name: Upload verified APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: repflow-debug-apk
          path: repflow-release/
          if-no-files-found: error
          retention-days: 7
