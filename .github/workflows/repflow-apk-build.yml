name: RepFlow APK Build

on:
  push:
    branches:
      - repflow-capacitor-apk-build-290820262129
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-repflow-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Diagnose and rehydrate exact RepFlow Capacitor source
        shell: bash
        run: |
          set -euxo pipefail
          exec > >(tee -a /tmp/rehydrate-diagnostics.txt) 2>&1
          EXPECTED=(
            c4ea1db06db68c8252b2c007f0b70ad230cfe19b
            fbe6961c75e0d42387107a5d1d2c5741f25fff10
            b3a3098b1c1abc59e61213bf95f7f55ea18c2f1c
            c158f6bae8dd7d9f2a390bbe3faa94dbad089366
            f6483dd486f733f2722941568551b630c90c5b60
            d67d5b4e027bc53a28015118212ca4ffaa68e926
            896c6c90f5763b8db805c2224938d6a9ae44ce5b
            61fa67da8f2e08968bc77d79fdadea1d731ae206
          )
          i=0
          for n in 01 02 03 04 05 06 07 08; do
            f="repflow-ci/bundle.part${n}"
            test -f "$f"
            actual="$(git hash-object "$f")"
            bytes="$(wc -c < "$f")"
            echo "$f bytes=$bytes git_blob=$actual expected=${EXPECTED[$i]}"
            test "$actual" = "${EXPECTED[$i]}"
            i=$((i+1))
          done
          cat repflow-ci/bundle.part{01..08} > /tmp/repflow.b64
          python - <<'PY'
          import base64, binascii
          from pathlib import Path

          ws = set(b' \t\r\n\v\f')
          alphabet = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          src = Path('/tmp/repflow.b64').read_bytes()
          clean = bytes(b for b in src if b not in ws)
          bad = [(i,b) for i,b in enumerate(src) if b not in alphabet and b not in ws]
          print(f'bundle_raw_bytes={len(src)} bundle_clean_bytes={len(clean)} mod4={len(clean)%4} invalid_count={len(bad)}')
          print('bundle_invalid_first20=' + repr(bad[:20]))
          for pos,b in bad[:10]:
              lo=max(0,pos-24); hi=min(len(src),pos+25)
              print(f'bundle_invalid_context pos={pos} byte=0x{b:02x} context={src[lo:hi]!r}')

          payload_paths=[Path('repflow-ci/payload.part00'),Path('repflow-ci/payload.part01')]
          if all(p.exists() for p in payload_paths):
              psrc=b''.join(p.read_bytes() for p in payload_paths)
              pclean=bytes(b for b in psrc if b not in ws)
              pbad=[(i,b) for i,b in enumerate(psrc) if b not in alphabet and b not in ws]
              print(f'payload01_raw_bytes={len(psrc)} payload01_clean_bytes={len(pclean)} mod4={len(pclean)%4} invalid_count={len(pbad)}')
              print('payload01_invalid_first20=' + repr(pbad[:20]))
              lcp=0
              for a,b in zip(src,psrc):
                  if a!=b: break
                  lcp+=1
              print(f'bundle_vs_payload_lcp={lcp}')
              if lcp < min(len(src),len(psrc)):
                  print(f'bundle_mismatch={src[max(0,lcp-32):lcp+64]!r}')
                  print(f'payload_mismatch={psrc[max(0,lcp-32):lcp+64]!r}')

          try:
              out=base64.b64decode(clean, validate=True)
          except binascii.Error as e:
              print(f'base64_strict_error={e}')
              raise
          print(f'zip_bytes={len(out)} magic={out[:4]!r}')
          if not out.startswith(b'PK'):
              raise SystemExit('decoded payload is not a ZIP')
          Path('/tmp/repflow_android_slim.zip').write_bytes(out)
          PY
          unzip -t /tmp/repflow_android_slim.zip
          mkdir -p repflow
          unzip -q /tmp/repflow_android_slim.zip -d repflow
          sha256sum /tmp/repflow_android_slim.zip | tee /tmp/source-sha256.txt
          test -f repflow/package.json
          test -f repflow/capacitor.config.json
          test -f repflow/scripts/bootstrap-capacitor.sh
          test -f repflow/scripts/patch-android.py
          test -f repflow/web/index.html

      - name: Upload rehydrate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repflow-rehydrate-diagnostics
          path: /tmp/rehydrate-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact Capacitor dependencies
        working-directory: repflow
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund

      - name: Verify exact Capacitor versions
        working-directory: repflow
        shell: bash
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const deps=['@capacitor/core','@capacitor/android','@capacitor/cli'];
          for (const d of deps) {
            const v=require(`./node_modules/${d}/package.json`).version;
            console.log(`${d}=${v}`);
            if (v !== '8.5.0') process.exit(1);
          }
          NODE

      - name: Generate and patch native Android project
        working-directory: repflow
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/bootstrap-capacitor.sh
          test -x android/gradlew
          grep -q 'net.nexarenew.repflow' capacitor.config.json
          grep -q 'networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          grep -q '>127.0.0.1<' android/app/src/main/res/xml/network_security_config.xml
          grep -q '>localhost<' android/app/src/main/res/xml/network_security_config.xml

      - name: Build debug APK
        working-directory: repflow/android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK identity, integrity and signature
        shell: bash
        run: |
          set -euxo pipefail
          APK="repflow/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p repflow-release
          cp "$APK" repflow-release/RepFlow-debug.apk
          sha256sum "$APK" | tee repflow-release/SHA256SUMS.txt
          cp /tmp/source-sha256.txt repflow-release/SOURCE_SHA256.txt

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee repflow-release/aapt-badging.txt
          grep -q "package: name='net.nexarenew.repflow'" repflow-release/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee repflow-release/apksigner-verification.txt
          unzip -t "$APK" | tee repflow-release/apk-zip-test.txt

          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            java -version 2>&1
            echo
            echo "Capacitor package manifest:"
            cat repflow/package.json
            echo
            echo "Gradle wrapper:"
            cat repflow/android/gradle/wrapper/gradle-wrapper.properties
          } > repflow-release/toolchain.txt

          cp repflow/android/app/build/outputs/apk/debug/output-metadata.json repflow-release/output-metadata.json

      - name: Upload verified APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: repflow-debug-apk
          path: repflow-release/
          if-no-files-found: error
          retention-days: 7
