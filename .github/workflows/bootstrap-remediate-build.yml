name: Code Dump Tool One-Time GitHub Remediation

on:
  push:
    branches: [ codedump-v1.1.0-capacitor-build ]
    paths:
      - '.github/workflows/bootstrap-remediate-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-dump-tool-bootstrap-remediation
  cancel-in-progress: false

env:
  CI: true

jobs:
  normalise-repository:
    name: Reconstruct, verify and normalise repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verified pre-remediation source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap-work
          mkdir -p bootstrap-work/extracted
          : > bootstrap-work/baseline.zip
          while IFS= read -r part; do
            tr -d '\r\n' < "$part" | base64 --decode --ignore-garbage >> bootstrap-work/baseline.zip
          done < <(find build_projection -maxdepth 1 -type f -name 'buildproj.part*.b64' | sort)
          echo "02fe87bea2103f93571a52ec6936efe0153cb2fa47597229699f1af074ac5b16  bootstrap-work/baseline.zip" | sha256sum -c -
          unzip -q bootstrap-work/baseline.zip -d bootstrap-work/extracted
          PACKAGE_JSON="$(find bootstrap-work/extracted -maxdepth 3 -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          test -n "$PACKAGE_JSON"
          PROJECT_ROOT="$(dirname "$PACKAGE_JSON")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          test -f "$PROJECT_ROOT/.github/workflows/android-build.yml"
          test -f "$PROJECT_ROOT/package-lock.json"

      - name: Verify and apply authority-correction delta
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source_patch.part* | base64 -d | gzip -d > bootstrap-work/source.patch
          echo "7ad2f09c9f053f690e69e2132488382e0773fe82ee55ee50b4e781cd22723804  bootstrap-work/source.patch" | sha256sum -c -
          (cd "$PROJECT_ROOT" && patch -p5 --batch --forward < "$GITHUB_WORKSPACE/bootstrap-work/source.patch")
          grep -Fq '**Rules-Version:** 1.2.16' "$PROJECT_ROOT/docs/MASTER_LLM_OPERATING_RULES.md"
          grep -Fq '**Revision:** 20260825-02' "$PROJECT_ROOT/docs/MASTER_LLM_OPERATING_RULES.md"

      - name: Verify and apply GitHub audit-remediation delta
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/runtime_patch.part* | base64 -d | gzip -d > bootstrap-work/runtime.patch
          echo "7c474c5a3a57e92a77022aa09613702d3f13d1243d5b7123b77edb5d21d1be55  bootstrap-work/runtime.patch" | sha256sum -c -
          (cd "$PROJECT_ROOT" && patch -p1 --batch --forward < "$GITHUB_WORKSPACE/bootstrap-work/runtime.patch")
          grep -Fq 'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.6.0' "$PROJECT_ROOT/.github/workflows/android-build.yml"
          grep -Fq 'Verify APK identity and signature' "$PROJECT_ROOT/.github/workflows/android-build.yml"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify authority-corrected repository
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run verify:repository
          test "$(node -p "require('./package.json').version")" = "1.1.0"

      - name: Prepare clean GitHub repository tree
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules android artifacts EXEC002_R5_EVIDENCE
          rm -f \
            ANDROID_BUILD_VERIFICATION_25082026040923.md \
            GITHUB_BUILD_VERIFICATION_25082026044534.md \
            GITHUB_REPOSITORY_COMPLIANCE_AUDIT_25082026043214.md \
            PACKAGE_MANIFEST.json \
            REM002_REMEDIATION_LEDGER_24082026082800.md \
            REM002_REMEDIATION_LEDGER_25082026040923.md \
            REMEDIATION_VERIFICATION_24082026082800.md \
            REMEDIATION_VERIFICATION_25082026040923.md

          cat > GITHUB_IMPORT_INSTRUCTIONS.md <<'EOF'
          # GitHub Repository Operation

          Code Dump Tool v1.1.0 is committed directly at repository root. The authoritative Android build workflow is `.github/workflows/android-build.yml`.

          - Pushes and pull requests targeting `main` run the Android verification/build pipeline.
          - `workflow_dispatch` is available from the default branch.
          - The debug APK is directly installable for device testing and does not require production signing secrets.
          - Production signing remains a separate owner-controlled release gate.
          - Verify each downloaded Actions artefact against its `SHA256SUMS.txt` before use.
          EOF

          STAMP="$(TZ=Europe/London date +%d%m%Y%H%M%S)"
          cat > "docs/GITHUB_REPOSITORY_REMEDIATION_${STAMP}.md" <<EOF
          # Code Dump Tool GitHub Repository Remediation

          **Bootstrap run:** $GITHUB_RUN_ID  
          **Bootstrap commit:** $GITHUB_SHA  
          **Application:** Code Dump Tool v1.1.0  
          **Package:** \`app.codedump.tool\`  
          **Master Rules:** v1.2.16 / revision 20260825-02

          The selected GitHub build host was normalised from its verified historical source capsule to the authority-corrected Code Dump Tool source. The authority-correction and GitHub audit-remediation deltas were SHA-256 verified before application. Source tests and repository verification passed before this clean tree was committed.

          A separate fresh Android CI run is still required to establish new APK build evidence from this normalised repository.
          EOF

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          excluded_dirs = {'.git', 'node_modules', 'android', 'artifacts'}
          excluded_files = {'REPOSITORY_MANIFEST.json', 'SHA256SUMS.txt'}
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel = p.relative_to(root)
              if any(part in excluded_dirs for part in rel.parts) or rel.as_posix() in excluded_files: continue
              data = p.read_bytes()
              rows.append({'path': rel.as_posix(), 'size_bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          manifest = {'schema': 1, 'project': 'Code Dump Tool', 'version': '1.1.0', 'classification': 'GitHub repository', 'file_count': len(rows), 'files': rows}
          Path('REPOSITORY_MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          manifest_bytes = Path('REPOSITORY_MANIFEST.json').read_bytes()
          rows2 = rows + [{'path':'REPOSITORY_MANIFEST.json','size_bytes':len(manifest_bytes),'sha256':hashlib.sha256(manifest_bytes).hexdigest()}]
          Path('SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['path']}\n" for r in sorted(rows2, key=lambda r:r['path'])), encoding='utf-8')
          PY
          npm test
          npm run verify:repository

          FINAL_DIR="$RUNNER_TEMP/codedump-final-source"
          rm -rf "$FINAL_DIR"
          mkdir -p "$FINAL_DIR"
          cp -a . "$FINAL_DIR/"
          echo "FINAL_DIR=$FINAL_DIR" >> "$GITHUB_ENV"

      - name: Commit clean source root to remediation branch and main
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$FINAL_DIR"/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          test -f .github/workflows/android-build.yml
          test -f package.json
          test ! -e build_projection
          test ! -e codedump-source
          test ! -e bootstrap
          npm test
          npm run verify:repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalise Code Dump Tool v1.1.0 GitHub build source"
          NORMALISED_SHA="$(git rev-parse HEAD)"
          echo "NORMALISED_SHA=$NORMALISED_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:codedump-v1.1.0-capacitor-build
          git push origin HEAD:main

      - name: Record normalised commit
        run: echo "Normalised repository commit $NORMALISED_SHA"
